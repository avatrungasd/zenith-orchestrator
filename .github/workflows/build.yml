name: Build WASM Contract

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
        targets: wasm32-unknown-unknown

    - name: Cache Cargo dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Build Smart Contract WASM
      run: |
        cargo build --release --target wasm32-unknown-unknown

    - name: Install wasm-opt
      run: |
        sudo apt-get update && sudo apt-get install -y binaryen

    - name: Optimize WASM
      run: |
        wasm-opt -O3 target/wasm32-unknown-unknown/release/zenith_orchestrator.wasm -o target/wasm32-unknown-unknown/release/zenith_orchestrator.opt.wasm

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: zenith-wasm
        path: |
          target/wasm32-unknown-unknown/release/zenith_orchestrator.wasm
          target/wasm32-unknown-unknown/release/zenith_orchestrator.opt.wasm
